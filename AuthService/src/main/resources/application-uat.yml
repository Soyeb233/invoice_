
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/invoice
    username: root
    password: root

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
              - email
  oauth:
    success-url: http://localhost:8282/invoice/oauth-success?token=
    failed-url: http://localhost:8282/invoice/login?error=true


