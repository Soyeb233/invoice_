logging:
  file:
    name: logs/authService/authService.log  # Path to the custom log file
  level:
    root: INFO              # Set the default logging level
    com.utiitsl.DMSAUTHSERVICE: DEBUG  # Set specific logging level for your package
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n"  # Console log format
    file: "%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n"     # File log format



